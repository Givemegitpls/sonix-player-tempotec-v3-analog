<!-- BlueZ 5 interfaces, which the stock policy (BlueZ 4 names) never allowed.

     The stock firmware talks to BlueZ 4.101, whose agent and endpoint objects
     are org.bluez.Agent, MediaEndpoint and MediaPlayer. The port puts BlueZ
     5.66 in its place, and that daemon calls org.bluez.Agent1 and
     MediaEndpoint1 instead. The stock file punches no hole for those names, so
     the calls are refused before they reach the object that would answer them.
     What that looks like from the outside: pairing fails and the phone says the
     PIN was wrong, while the device itself says nothing at all.

     No double hyphen anywhere in this file, comments included: XML forbids it,
     dbus-daemon throws the whole file away and says nothing. -->
<busconfig>
  <policy user="root">
    <allow send_interface="org.bluez.Agent1"/>
    <allow send_interface="org.bluez.MediaEndpoint1"/>
    <allow send_interface="org.bluez.MediaPlayer1"/>
    <allow send_interface="org.bluez.Profile1"/>
    <allow send_interface="org.bluez.HealthAgent1"/>
    <allow send_interface="org.bluez.LEAdvertisingManager1"/>
    <allow send_interface="org.bluez.GattManager1"/>
  </policy>
</busconfig>
