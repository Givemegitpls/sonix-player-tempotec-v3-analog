<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The player talks to two daemons over the system bus, and the stock policy
  allows neither conversation in full.

  bluez (see src/system/btplayer.h). The player registers an MPRIS media player
  so a pair of headphones learns what is being played. The default system policy
  denies every method call that is not explicitly permitted; bluez's own
  bluetooth.conf punches holes for root (sending to org.bluez, which covers
  RegisterPlayer, and org.freedesktop.DBus.Properties, which covers bluez
  reading our properties), but it never mentions org.mpris.MediaPlayer2.Player,
  so bluez calling Play or Next on our object would be refused before it reached
  us.

  bluealsa (see src/system/btvolume.h). The player reads and writes the stream's
  Volume and SoftVolume, and listens for the PropertiesChanged that says the
  headphones moved their own volume.

  The own line is the one this device needs and the Blaze does not: bluealsa
  owns its own bus name here, and the stock policy (BlueZ 4's, which had no
  bluealsa) never allowed anyone to take it. Without it the daemon starts,
  fails to own org.bluealsa, and every PCM that names it is "Unknown PCM".

  No double hyphen anywhere in this file, comments included: XML forbids it
  inside a comment, dbus-daemon rejects the whole file as malformed, and the
  failure is silent: the daemon starts, cannot own its name, and the player
  reports "NO AUDIO" with no hint that a comment character is the cause. The
  file this was copied from (the Blaze port's own) has it, so that one never
  worked either.
-->
<busconfig>
  <policy user="root">
    <allow own="org.bluealsa"/>
    <allow send_interface="org.mpris.MediaPlayer2.Player"/>
    <allow send_interface="org.mpris.MediaPlayer2"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bluez"/>
    <allow send_interface="org.bluez.Media1"/>
    <allow send_destination="org.bluealsa"/>
    <allow send_interface="org.bluealsa.PCM1"/>
    <allow receive_sender="org.bluealsa"/>
  </policy>
</busconfig>
