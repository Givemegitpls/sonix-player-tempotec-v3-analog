name: Firmware page

# Publishes the firmware page: the static site under web/, the wasm mkfs.ubifs the
# page packs with, and the payload of the **newest tag** that carries one.
#
# What is deliberately not here: building the player. The page offers released
# versions only -- a tag, never the tip of a branch -- so the payload comes from
# the release `.github/workflows/player-package.yml` publishes
# (`firmware-payload-<board>.tar.gz`), not from this checkout. That also means no
# MIPS toolchain and a deploy measured in a minute or two rather than an hour.
#
# The release keeps the complete payload; this deployment takes it apart into the
# player half and the content-addressed asset blob the browser can actually fetch
# (see sonix-packer/tools/make_versions_json.sh), which is why the site is ~26 MB
# rather than a copy of every payload.
#
# What is never here: the vendor's firmware. The page takes that from the user, in
# their browser; the image is a modified copy of the vendor's and the licence does
# not allow publishing it (docs/BUILD.md, "Distributing an image").

on:
  push:
    branches: [main]
    paths:
      - web/**
      - sonix-packer/tools/wasm/**
      - sonix-packer/tools/make_versions_json.sh
      - sonix-packer/tools/make_site_payload.sh
      - sonix-packer/docker/wasm/**
      - .github/workflows/pages.yml
  # A published release republishes the site, so the newest tag becomes the one the
  # page offers.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  WASM_IMAGE: tempotec-wasm-tools

jobs:
  # The page's own answer to "is this the right image?", before anything is
  # published: the guard's checks (bootloader, kernel, VERSION.TXT, the vendor base
  # inside the rootfs) and their refusals. No wasm, no firmware fixture.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The image guard
        run: node sonix-packer/tools/webtest/guard.test.mjs

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the wasm toolchain and the downloaded sources
        uses: actions/cache@v4
        with:
          path: |
            sonix-packer/build-wasm/dl
            sonix-packer/build-wasm/src
            sonix-packer/build-wasm/obj
            sonix-packer/build-wasm/out
          key: wasm-${{ hashFiles('sonix-packer/docker/wasm/Dockerfile', 'sonix-packer/tools/wasm/**') }}
          restore-keys: |
            wasm-

      - name: Build mkfs.ubifs for the browser
        run: sonix-packer/tools/wasm/build.sh

      - name: Stage the site
        run: |
          mkdir -p _site/wasm
          cp -r web/. _site/
          cp sonix-packer/build-wasm/out/mkfs_ubifs.js \
             sonix-packer/build-wasm/out/mkfs_ubifs.wasm _site/wasm/

      - name: The newest released payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: sonix-packer/tools/make_versions_json.sh _site "${{ github.repository }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
