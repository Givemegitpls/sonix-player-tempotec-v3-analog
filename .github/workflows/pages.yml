name: Firmware page

# Publishes the firmware page for **one tag**, on demand.
#
# The page is pinned: it builds images from the payload of a tag's release and
# nothing else, so it is redeployed when a release is published (the release job of
# player-package.yml dispatches this workflow with the tag) and not on every commit.
# A page that follows `main` would offer builds nobody released.
#
# Runs only from `main`: the `github-pages` environment refuses any other ref
# ("Branch ... is not allowed to deploy to github-pages due to environment
# protection rules"), and the jobs are gated on the ref so a dispatch from a branch
# neither builds nor deploys. The tag is checked out inside the run, which is how a
# run dispatched on `main` publishes the tag's tree.
#
# The payload comes from that tag's release (`firmware-payload-<board>.tar.gz`,
# attached by player-package.yml), not from this checkout: the release is where a
# complete payload lives, and the wasm mkfs.ubifs is built from the same tag.
#
# What is never here: the vendor's firmware. The page takes that from the user, in
# their browser; the image is a modified copy of the vendor's and the licence does
# not allow publishing it (docs/BUILD.md, "Distributing an image").

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish the page for (e.g. 0.5.2)'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  WASM_IMAGE: tempotec-wasm-tools

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # The tree of the tag being published, not of the branch the run was
          # dispatched on.
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Cache the wasm toolchain and the downloaded sources
        uses: actions/cache@v4
        with:
          path: |
            sonix-packer/build-wasm/dl
            sonix-packer/build-wasm/src
            sonix-packer/build-wasm/obj
            sonix-packer/build-wasm/out
          key: wasm-${{ inputs.tag }}-${{ hashFiles('sonix-packer/docker/wasm/Dockerfile', 'sonix-packer/tools/wasm/**') }}
          restore-keys: |
            wasm-

      - name: Build mkfs.ubifs for the browser
        run: sonix-packer/tools/wasm/build.sh

      - name: Stage the site
        run: |
          mkdir -p _site/wasm
          cp -r web/. _site/
          cp sonix-packer/build-wasm/out/mkfs_ubifs.js \
             sonix-packer/build-wasm/out/mkfs_ubifs.wasm _site/wasm/

      - name: The tag's released payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: sonix-packer/tools/make_versions_json.sh _site "${{ github.repository }}" "${{ inputs.tag }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
